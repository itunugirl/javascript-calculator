<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <div class="calculator">
        <div class="top-bar">
            <span class="app-title">
                Calculator

            </span>
            <button id="theme-toggle">🌙</button>
        </div>
        <div class="screen-container">
            <div id="history" class="history-display"></div>
            <input type="text" id="display" readonly placeholder="0">
        </div>
        <div class="buttons">
            <button class="btn fn" data-action="clear">C</button>
            <button class="btn fn" data-action="delete">DEL</button>

            <button class="btn fn" data-action="percentage">%</button>
            <button class="btn op" onclick="appendvalue('/')">&divide;</button>

            <button class="btn" onclick="appendvalue('7')">7</button>
            <button class="btn" onclick="appendvalue('8')">8</button>
            <button class="btn" onclick="appendvalue('9')">9</button>
            <button class="btn op" onclick="appendvalue('*')">&times;</button>

            <button class="btn" onclick="appendvalue('4')">4</button>
            <button class="btn" onclick="appendvalue('5')">5</button>
            <button class="btn" onclick="appendvalue('6')">6</button>
            <button class="btn op" onclick="appendvalue('-')">-</button>

            <button class="btn" onclick="appendvalue('1')">1</button>
            <button class="btn" onclick="appendvalue('2')">2</button>
            <button class="btn" onclick="appendvalue('3')">3</button>
            <button class="btn op" onclick="appendvalue('+')">+</button>

            <button class="btn zero-btn" onclick="appendvalue('0')">0</button>
            <button class="btn" onclick="appendvalue('.')">.</button>
            <button class="btn equal-btn" data-action="equals">=</button>
        </div>
    </div>
        <script src="script.js"></script>
</body>
</html>
